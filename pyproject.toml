[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afl-mcp"
version = "1.1.2"
description = "AFL statistics platform with PostgreSQL storage, CLI, and MCP server"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "fastmcp>=2.0",
    "starlette>=0.27",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0",
]
test = [
    "pytest>=9.0",
]

[project.scripts]
afl-mcp = "afl_mcp.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/afl_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]
