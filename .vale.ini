StylesPath = styles
MinAlertLevel = error
Vocab = Project

# Project exception: public-documentation checks skip internal agent files,
# plans, archived docs, vendored upstream notes and tool output. Keep this
# list in step with .rumdl.toml and VALE_GLOB in documentation.yml.

[*.md]
BasedOnStyles = Vale, House
Vale.Spelling = NO

[{node_modules,.wrangler,.claude,plans,archive}/**/*.md]
BasedOnStyles =

[tools/oxlint/anti-slop/**/*.md]
BasedOnStyles =

[{AGENTS,CLAUDE,HANDOFF}.md]
BasedOnStyles =
