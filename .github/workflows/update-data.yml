name: Update AFL Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year to extract (blank = current year)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  update:
    name: Extract and load data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ETL image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: etl/Dockerfile
          tags: afl-mcp-etl:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          SEASON="${{ github.event.inputs.season }}"
          if [ -z "$SEASON" ]; then
            SEASON=$(date +%Y)
          fi
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            afl-mcp-etl:latest \
            sh -c "Rscript etl/extract.R $SEASON && afl-mcp db migrate && afl-mcp db load --data-dir data/raw"

  embed:
    name: Generate incremental embeddings
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build embedding image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: etl/Dockerfile.embed
          tags: afl-mcp-embed:latest
          load: true
          cache-from: type=gha,scope=embed
          cache-to: type=gha,mode=max,scope=embed

      - name: Run incremental embedding
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            afl-mcp-embed:latest
