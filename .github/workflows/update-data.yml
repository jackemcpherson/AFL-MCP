name: Update AFL Data

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year to extract (blank = current year)"
        required: false
        type: string
      force:
        description: "Force load even if freshness check says data is current"
        required: false
        type: boolean
        default: false

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Extract and load data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      new_data: ${{ steps.etl.outputs.new_data }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build ETL image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: etl/Dockerfile
          tags: afl-mcp-etl:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run ETL
        id: etl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          SEASON="${{ inputs.season }}"
          if [ -z "$SEASON" ]; then
            SEASON=$(date +%Y)
          fi
          FORCE="${{ inputs.force }}"
          RESULT=$(docker run --rm \
            --env DATABASE_URL \
            afl-mcp-etl:latest \
            sh -c "
              Rscript etl/extract.R $SEASON >&2 &&
              afl-mcp db migrate >&2 &&
              if [ '$FORCE' = 'true' ] || afl-mcp db check-freshness --data-dir data/raw >&2; then
                afl-mcp db load --data-dir data/raw >&2 &&
                echo true
              else
                echo false
              fi
            ")
          echo "new_data=${RESULT}" >> "$GITHUB_OUTPUT"

      - name: Calculate PAV for current season
        if: steps.etl.outputs.new_data == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          SEASON="${{ inputs.season }}"
          if [ -z "$SEASON" ]; then
            SEASON=$(date +%Y)
          fi
          docker run --rm \
            --env DATABASE_URL \
            afl-mcp-etl:latest \
            afl-mcp db pav --year "$SEASON"

  embed:
    name: Generate incremental embeddings
    needs: update
    if: needs.update.outputs.new_data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build embedding image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: etl/Dockerfile.embed
          tags: afl-mcp-embed:latest
          load: true
          cache-from: type=gha,scope=embed
          cache-to: type=gha,mode=max,scope=embed

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm \
            --env DATABASE_URL \
            afl-mcp-embed:latest \
            afl-mcp db migrate

      - name: Run incremental embedding
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm \
            --env DATABASE_URL \
            afl-mcp-embed:latest
