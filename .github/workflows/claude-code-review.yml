name: Claude Code Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Custom review prompt'
        required: false
        default: >-
          Perform a thorough baseline code review of the entire codebase.
          Review all Python files under src/ and tests/ for: code quality,
          security issues, type safety, error handling, performance concerns,
          adherence to project conventions in CLAUDE.md, and test coverage gaps.
          Create a GitHub issue summarising your findings, grouped by severity
          (critical, warning, suggestion). Title the issue
          "Baseline Code Review — <date>".

jobs:
  claude-review:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor == 'jackemcpherson'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review (PR)
        if: github.event_name == 'pull_request_target'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-4-6'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'

      - name: Run Claude Code Review (Full Codebase)
        if: github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-4-6 --allowedTools "Bash(gh issue create:*),Bash(gh:*),Read,Glob,Grep,Write"'
          prompt: ${{ github.event.inputs.prompt }}

