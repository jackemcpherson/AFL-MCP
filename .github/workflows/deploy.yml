name: Publish artifact

# afl-mcp no longer self-deploys. On merge to main it builds the Worker bundle
# and publishes it to R2 (worker-artifacts/afl-mcp/<sha>.js) together with the
# D1 migrations (afl-mcp/<sha>-migrations.tar.gz). Deployment happens from the
# cloudflare-infra repo by bumping afl_mcp_version to this SHA; the infra
# pipeline applies migrations BEFORE uploading the Worker, so migrations must
# stay backwards-compatible with the previous Worker version (expand-contract).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy.yml"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to R2
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Worker bundle
        run: bunx wrangler deploy --dry-run --outdir dist

      - name: Bundle D1 migrations
        run: tar -czf migrations.tar.gz -C src/db migrations

      - name: Publish artifact to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "Publishing afl-mcp/${SHA}.js and afl-mcp/${SHA}-migrations.tar.gz"
          bunx wrangler r2 object put "worker-artifacts/afl-mcp/${SHA}.js" \
            --file dist/index.js --remote
          bunx wrangler r2 object put "worker-artifacts/afl-mcp/${SHA}-migrations.tar.gz" \
            --file migrations.tar.gz --remote
          echo "Deploy by bumping afl_mcp_version to ${SHA} in cloudflare-infra."
