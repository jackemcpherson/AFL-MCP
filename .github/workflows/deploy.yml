name: Publish artifact

# afl-mcp no longer self-deploys. On merge to main CI checks the commit,
# bundles the Worker once and hands that bundle and the D1 migrations to the
# publish job, which puts them in R2 (worker-artifacts/afl-mcp/<sha>.js and
# afl-mcp/<sha>-migrations.tar.gz). Deployment happens from the
# cloudflare-infra repo through promote-worker.yml and its reviewed release
# descriptor. The pipeline applies migrations BEFORE uploading the Worker, so
# migrations must stay backwards-compatible with the previous Worker version
# (expand-contract).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml
    with:
      upload-bundle: true

  publish:
    name: Publish to R2
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      # Checkout and install only provide the lockfile-pinned wrangler for the
      # R2 upload. The bundle itself comes from the CI job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download checked bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-bundle
          path: dist

      - name: Publish artifact to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ARTIFACT_DIGEST="$(sha256sum dist/index.js | cut -d' ' -f1)"
          MIGRATIONS_DIGEST="$(sha256sum dist/migrations.tar.gz | cut -d' ' -f1)"
          echo "Publishing afl-mcp/${GITHUB_SHA}.js and afl-mcp/${GITHUB_SHA}-migrations.tar.gz"
          bunx wrangler r2 object put "worker-artifacts/afl-mcp/${GITHUB_SHA}.js" \
            --file dist/index.js --remote
          bunx wrangler r2 object put "worker-artifacts/afl-mcp/${GITHUB_SHA}-migrations.tar.gz" \
            --file dist/migrations.tar.gz --remote
          {
            echo "### Published Worker artifacts"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- \`afl-mcp/${GITHUB_SHA}.js\`: \`${ARTIFACT_DIGEST}\`"
            echo "- \`afl-mcp/${GITHUB_SHA}-migrations.tar.gz\`: \`${MIGRATIONS_DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
