name: CI

# One run per PR head. The main ruleset requires the `check` context and an
# up-to-date branch, so a PR's last run already covers the tree that lands on
# main. deploy.yml and release.yml call this workflow for main and tags.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      upload-bundle:
        description: "Upload the dry-run bundle and migrations for publishing"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # vp and the unit test project run on Node. Under Bun's node shim the
      # MCP golden tests see different Response headers.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify schema and reference seeds
        run: bun run check:schema

      - name: Format, lint and type check
        run: bun run check

      - name: Test
        run: bunx vp test --run

      # Bundles the Worker as a deploy would, with no credentials and no
      # upload. deploy.yml publishes these exact bytes.
      - name: Bundle Worker (dry run)
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run"
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Bundle D1 migrations
        if: inputs.upload-bundle
        run: tar -czf "$RUNNER_TEMP/wrangler-dry-run/migrations.tar.gz" -C src/db migrations

      - name: Upload bundle for publishing
        if: inputs.upload-bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-bundle
          path: |
            ${{ runner.temp }}/wrangler-dry-run/index.js
            ${{ runner.temp }}/wrangler-dry-run/migrations.tar.gz
          if-no-files-found: error
          retention-days: 1
