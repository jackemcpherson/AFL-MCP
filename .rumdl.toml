[global]
flavor = "gfm"
line-length = 80
respect-gitignore = true
# Project exception: public-documentation checks skip internal agent files,
# plans, archived docs, vendored upstream notes and tool output.
exclude = [
  "node_modules/**",
  ".wrangler/**",
  ".claude/**",
  "plans/**",
  "archive/**",
  "tools/oxlint/anti-slop/**",
  "AGENTS.md",
  "CLAUDE.md",
  "HANDOFF.md",
]
extend-enable = ["MD060", "MD063", "MD080", "MD082", "MD083", "MD084"]

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD013]
line-length = 80
code_blocks = false
headings = false
tables = false

[MD033]
allowed_elements = []

[MD035]
style = "---"

[MD046]
style = "fenced"

[MD048]
style = "backtick"

[MD060]
style = "aligned"

[MD063]
style = "title-case"
