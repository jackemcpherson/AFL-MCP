name = "afl-mcp"
main = "src/index.ts"
compatibility_date = "2026-04-01"

routes = [
  { pattern = "afl.jackemcpherson.com/mcp*", zone_name = "jackemcpherson.com" }
]

[[d1_databases]]
binding = "DB"
database_name = "afl-stats"
database_id = "fe1c1a89-805f-481d-9ba0-b9f8dee04a36"
migrations_dir = "src/db/migrations"

[[worker_loaders]]
binding = "LOADER"

# Per-IP rate limit for the public MCP endpoint (SEC-03).
[[ratelimits]]
name = "MCP_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["*/5 * * * *"]
